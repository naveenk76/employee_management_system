{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2>Manage Users</h2>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Username</th>
                <th>Role</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for user, role in users.items() %}
            <tr>
                <td>{{ user }}</td>
                <td>{{ role }}</td>
                <td>
                    <a href="{{ url_for('edit_user', username=user) }}" class="btn btn-warning btn-sm">Edit</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
