{% extends 'base.html' %}

{% block content %}
<h2>Update Employee</h2>

<form method="post">
    <div class="mb-3">
        <label>Name</label>
        <input type="text" name="name" class="form-control" value="{{ employee.name }}" required>
    </div>
    <div class="mb-3">
        <label>Age</label>
        <input type="number" name="age" class="form-control" value="{{ employee.age }}" required>
    </div>
    <div class="mb-3">
        <label>Position</label>
        <input type="text" name="position" class="form-control" value="{{ employee.position }}" required>
    </div>
    <div class="mb-3">
        <label>Salary</label>
        <input type="number" step="0.01" name="salary" class="form-control" value="{{ employee.salary }}" required>
    </div>
    <button type="submit" class="btn btn-primary">Update Employee</button>
</form>
{% endblock %}
